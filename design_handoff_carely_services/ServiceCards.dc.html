<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital@1&display=swap" rel="stylesheet">
<style>
/* Card hover is a coordinated state change across children — not expressible inline. */
.om-sc-img { opacity: 0; }
@media (hover: hover) and (pointer: fine) {
  .om-sc .om-sc-img { transition: opacity 320ms ease; }
  .om-sc:hover .om-sc-img { opacity: 1; }
  .om-sc { transition: background-color 320ms ease, border-color 320ms ease; }
  .om-sc .om-sc-t, .om-sc .om-sc-d, .om-sc .om-sc-l { transition: color 320ms ease; }
  .om-sc .om-sc-div { transition: background-color 320ms ease; }
  .om-sc .om-sc-ic { transition: background-color 320ms ease; }
  .om-sc .om-sc-ic svg { transition: stroke 320ms ease; }
  .om-sc:hover { background-color: #273A29 !important; border-color: #273A29 !important; }
  .om-sc:hover .om-sc-t, .om-sc:hover .om-sc-l { color: #FFFFFF !important; }
  .om-sc:hover .om-sc-d { color: #FFFFFF !important; }
  .om-sc:hover .om-sc-div { background-color: rgba(248,251,239,0.3) !important; }
  .om-sc:hover .om-sc-ic { background-color: #F8FBEF !important; }
  .om-sc:hover .om-sc-ic svg { stroke: #273A29 !important; }
}
@media (prefers-reduced-motion: reduce) {
  .om-sc, .om-sc * { transition: none !important; }
}
</style>
</helmet>
<section aria-label="Our services" style="width:100%; background:#F8FBEF; font-family:'DM Sans', sans-serif; box-sizing:border-box; padding:clamp(60px,7vw,110px) 0 clamp(70px,8vw,130px);">
  <div style="width:calc(100% - 80px); max-width:1440px; margin:0 auto; display:flex; flex-direction:column; gap:clamp(22px,2.2vw,32px);">

    <div style="display:grid; gap:clamp(22px,2.2vw,32px); grid-template-columns:{{ primaryCols }};">
      <sc-for list="{{ primary }}" as="s" hint-placeholder-count="3">
        <div class="om-sc" style="min-width:0; position:relative; overflow:hidden; display:flex; flex-direction:column; background:#FFFFFF; border:1px solid #ECEFE4; border-radius:24px; padding:clamp(28px,2.8vw,40px); box-sizing:border-box; text-decoration:none;" style-focus="outline:2px solid #E2A76F; outline-offset:3px;">
          <span class="om-sc-img" style="position:absolute; inset:0; border-radius:inherit; overflow:hidden; display:block;">
            <span aria-hidden="true" style="position:absolute; inset:0; background:#E8ECE0 url('./assets/service-hover.png') center/cover no-repeat;"></span>
            <span aria-hidden="true" style="position:absolute; inset:0; background:#273A29; opacity:0.78; pointer-events:none;"></span>
          </span>
          <span style="position:relative; z-index:1; display:flex; flex-direction:column; flex:1;">
            <span aria-hidden="true" class="om-sc-ic" style="width:74px; height:74px; border-radius:50%; background:#E2A76F; display:flex; align-items:center; justify-content:center;">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" dangerouslySetInnerHTML="{{ s.icon }}"></svg>
            </span>
            <h3 class="om-sc-t" style="margin:clamp(26px,2.4vw,34px) 0 0; font-weight:700; font-size:clamp(21px,1.8vw,27px); line-height:1.25; color:#273A29;">{{ s.title }}</h3>
            <p class="om-sc-d" style="margin:14px 0 clamp(26px,2.6vw,36px); font-size:17px; line-height:1.6; color:#6E756E; text-wrap:pretty;">{{ s.desc }}</p>
            <span aria-hidden="true" class="om-sc-div" style="display:block; height:1px; background:#E7EADF; margin-top:auto;"></span>
            <span class="om-sc-l" style="margin-top:22px; display:inline-flex; align-items:center; gap:10px; font-size:18px; font-weight:700; color:#273A29;">
              Learn More
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </span>
          </span>
        </div>
      </sc-for>
    </div>

    <div style="display:grid; gap:clamp(22px,2.2vw,32px); grid-template-columns:{{ secondaryCols }};">
      <sc-for list="{{ secondary }}" as="s" hint-placeholder-count="4">
        <div class="om-sc" style="min-width:0; position:relative; overflow:hidden; display:flex; flex-direction:column; background:#FFFFFF; border:1px solid #ECEFE4; border-radius:24px; padding:clamp(24px,2.2vw,32px); box-sizing:border-box; text-decoration:none;" style-focus="outline:2px solid #E2A76F; outline-offset:3px;">
          <span class="om-sc-img" style="position:absolute; inset:0; border-radius:inherit; overflow:hidden; display:block;">
            <span aria-hidden="true" style="position:absolute; inset:0; background:#E8ECE0 url('./assets/service-hover.png') center/cover no-repeat;"></span>
            <span aria-hidden="true" style="position:absolute; inset:0; background:#273A29; opacity:0.78; pointer-events:none;"></span>
          </span>
          <span style="position:relative; z-index:1; display:flex; flex-direction:column; flex:1;">
            <span aria-hidden="true" class="om-sc-ic" style="width:66px; height:66px; border-radius:50%; background:#E2A76F; display:flex; align-items:center; justify-content:center;">
              <svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" dangerouslySetInnerHTML="{{ s.icon }}"></svg>
            </span>
            <h3 class="om-sc-t" style="margin:clamp(22px,2vw,30px) 0 0; font-weight:700; font-size:clamp(20px,1.6vw,24px); line-height:1.25; color:#273A29;">{{ s.title }}</h3>
            <p class="om-sc-d" style="margin:12px 0 clamp(22px,2.2vw,30px); font-size:17px; line-height:1.6; color:#6E756E; text-wrap:pretty;">{{ s.desc }}</p>
            <span aria-hidden="true" class="om-sc-div" style="display:block; height:1px; background:#E7EADF; margin-top:auto;"></span>
            <span class="om-sc-l" style="margin-top:20px; display:inline-flex; align-items:center; gap:10px; font-size:18px; font-weight:700; color:#273A29;">
              Learn More
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </span>
          </span>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? window.innerWidth : 1200 };

  componentDidMount() {
    this.onResize = () => this.setState({ width: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    this.onResize();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }

  renderVals() {
    const w = this.state.width;
    const html = (s) => ({ __html: s });

    const primary = [
      {
        title: 'Telemedicine Services', slot: 'service-hover-telemedicine',
        desc: 'Our telemedicine services further enhance the level of care we provide by allowing PCAs and NPs to triage cases via video with immediate physician backup.',
        icon: html('<rect x="2.8" y="4.2" width="18.4" height="12.6" rx="2.2"></rect><path d="M8.4 20.4h7.2"></path><circle cx="12" cy="9.2" r="1.9"></circle><path d="M8.9 14.2c.5-1.7 1.6-2.5 3.1-2.5s2.6.8 3.1 2.5"></path>'),
      },
      {
        title: 'On-Site Care', slot: 'service-hover-onsite',
        desc: 'Daily rounding, early treatment, and on-site medication management ensure residents receive the right care, right away.',
        icon: html('<path d="M4 10.6 12 4l8 6.6V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"></path><path d="M12 11.4v5M9.5 13.9h5"></path>'),
      },
      {
        title: 'Specialist Access', slot: 'service-hover-specialist',
        desc: 'We provide direct access to specialists including psychiatry, ID, cardiology, and more—at the right time for better outcomes.',
        icon: html('<circle cx="9.2" cy="8.6" r="3"></circle><path d="M3.6 18.4c0-3 2.5-4.8 5.6-4.8s5.6 1.8 5.6 4.8"></path><path d="M16.2 6.8a2.6 2.6 0 0 1 0 5M17.6 13.8c1.9.5 3 1.9 3 4.4"></path>'),
      },
    ];

    const secondary = [
      {
        title: 'Medication Management', slot: 'service-hover-medication',
        desc: 'Optimization, reconciliation, monitoring.',
        icon: html('<rect x="3.2" y="8.4" width="17.6" height="7.2" rx="3.6" transform="rotate(-45 12 12)"></rect><path d="M9.6 9.6 14.4 14.4"></path>'),
      },
      {
        title: 'CHF/COPD', slot: 'service-hover-chfcopd',
        desc: 'On-site treatment to prevent exacerbation.',
        icon: html('<path d="M12 3.6v7.4"></path><path d="M12 11c-1.2-2.6-2.6-4-4.3-4-1.6 0-2.5 1.2-2.7 3.4-.2 2.4.2 5 1.2 7.2.5 1.1 1.5 1.6 2.6 1.3 1.4-.4 2.2-1.6 2.4-3.4z"></path><path d="M12 11c1.2-2.6 2.6-4 4.3-4 1.6 0 2.5 1.2 2.7 3.4.2 2.4-.2 5-1.2 7.2-.5 1.1-1.5 1.6-2.6 1.3-1.4-.4-2.2-1.6-2.4-3.4z"></path>'),
      },
      {
        title: 'Sepsis', slot: 'service-hover-sepsis',
        desc: 'Early recognition and IV antibiotic protocols.',
        icon: html('<path d="M12 3.4 19.4 6v6.2c0 4-3 6.9-7.4 8.4-4.4-1.5-7.4-4.4-7.4-8.4V6z"></path><path d="M12 8.6v4.8M9.6 11h4.8"></path>'),
      },
      {
        title: 'UTI/Pneumonia', slot: 'service-hover-utipneumonia',
        desc: 'Culture-guided therapy, resistance prevention.',
        icon: html('<circle cx="12" cy="12" r="5.2"></circle><path d="M12 6.8V3.6M12 17.2v3.2M6.8 12H3.6M17.2 12h3.2M8.3 8.3 6 6M15.7 15.7 18 18M15.7 8.3 18 6M8.3 15.7 6 18"></path>'),
      },
    ];

    return {
      primary,
      secondary,
      primaryCols: w >= 1040 ? 'repeat(3, minmax(0, 1fr))' : w >= 700 ? 'repeat(2, minmax(0, 1fr))' : 'minmax(0, 1fr)',
      secondaryCols: w >= 1200 ? 'repeat(4, minmax(0, 1fr))' : w >= 700 ? 'repeat(2, minmax(0, 1fr))' : 'minmax(0, 1fr)',
    };
  }
}
</script>
</body>
</html>
