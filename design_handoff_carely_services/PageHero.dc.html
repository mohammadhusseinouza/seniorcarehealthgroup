<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital@1&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
</helmet>
<section aria-labelledby="page-hero-title" style="width:calc(100% - 32px); max-width:1480px; margin:clamp(20px,2.4vw,34px) auto 0; background:#E2A76F; box-sizing:border-box; position:relative; overflow:hidden; min-height:clamp(250px,27vw,380px); border-radius:clamp(20px,2.4vw,34px); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:clamp(44px,5.5vw,72px) clamp(20px,4vw,60px); font-family:'DM Sans', sans-serif;">
  <div style="position:absolute; inset:0; overflow:hidden; border-radius:inherit;">
    <div style="position:absolute; inset:-6%; filter:blur(9px); transform:scale(1.06);">
      <image-slot id="{{ slotId }}" shape="rect" fit="cover" placeholder="drop hero background: caregiver with elderly person in a warm care setting"></image-slot>
    </div>
    <div aria-hidden="true" style="position:absolute; inset:0; background:#E2A76F; opacity:0.72; pointer-events:none;"></div>
  </div>

  <svg aria-hidden="true" viewBox="0 0 200 200" style="position:absolute; left:clamp(-70px,-4vw,-30px); bottom:clamp(-70px,-4vw,-30px); width:clamp(150px,17vw,230px); height:auto; opacity:0.16; pointer-events:none;">
    <g fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
      <path d="M100 100c-6-26 4-46 18-52s28 8 24 26-22 28-42 26Z"></path>
      <path d="M100 100c18-20 40-24 51-13s3 31-15 35-30-8-36-22Z"></path>
      <path d="M100 100c26 6 40 24 36 39s-24 20-35 7-6-32-1-46Z"></path>
      <path d="M100 100c-2 27-16 43-32 42s-24-19-15-34 30-16 47-8Z"></path>
      <path d="M100 100c-24-12-34-32-26-45s28-13 38 2 0 32-12 43Z"></path>
      <circle cx="100" cy="100" r="9"></circle>
    </g>
  </svg>

  <svg aria-hidden="true" viewBox="0 0 160 220" style="position:absolute; right:clamp(-46px,-2.6vw,-18px); top:clamp(-56px,-3.4vw,-24px); width:clamp(100px,11vw,150px); height:auto; opacity:0.18; pointer-events:none;">
    <g fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
      <path d="M80 214C30 168 14 108 30 44c58 2 100 44 106 104-4 40-26 58-56 66Z"></path>
      <path d="M80 214C68 154 58 96 34 46"></path>
      <path d="M74 186c14-14 30-22 48-24M68 158c14-16 28-26 46-30M60 128c14-16 26-26 42-32M52 98c12-16 22-24 36-30M44 70c10-12 18-18 28-22"></path>
    </g>
  </svg>

  <h1 id="page-hero-title" style="position:relative; margin:0; text-align:center; color:#FFFFFF; font-family:'DM Sans', sans-serif; font-weight:700; font-size:clamp(42px,6vw,78px); line-height:1.1; letter-spacing:-0.02em; text-wrap:balance;">{{ titleMain }} <em style="font-family:'Lora', serif; font-style:italic; font-weight:400; letter-spacing:0;">{{ titleAccent }}</em></h1>

  <p style="position:relative; margin:clamp(16px,1.8vw,24px) 0 0; display:flex; align-items:center; justify-content:center; gap:12px; color:#FFFFFF; font-size:clamp(16px,1.7vw,23px); font-weight:400;">
    <a href="Navbar.dc.html" style="color:#FFFFFF; text-decoration:none; transition:opacity 0.2s ease;" style-hover="opacity:0.75;">Home</a>
    <span aria-hidden="true" style="opacity:0.8;">/</span>
    <span aria-current="page">{{ breadcrumbCurrent }}</span>
  </p>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:420},&quot;titleMain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;titleAccent&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;us&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;breadcrumbCurrent&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About Us&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;page-hero-bg&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      titleMain: this.props.titleMain ?? 'About',
      titleAccent: this.props.titleAccent ?? 'us',
      breadcrumbCurrent: this.props.breadcrumbCurrent ?? 'About Us',
      slotId: this.props.slotId ?? 'page-hero-bg',
    };
  }
}
</script>
</body>
</html>
