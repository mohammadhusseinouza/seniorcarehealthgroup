<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital@1&display=swap" rel="stylesheet">
</helmet>
<div style="width:100%; background:#F8FBEF; padding:30px 0 8px; box-sizing:border-box; display:flex; justify-content:center; font-family:'DM Sans', sans-serif;">
  <nav style="width:calc(100% - 64px); max-width:1080px; background:#273A29; border-radius:44px; display:flex; align-items:center; justify-content:space-between; padding:8px 14px 8px 32px; box-sizing:border-box; height:80px;">
    <a href="Navbar.dc.html" style="display:flex; align-items:center; gap:9px; text-decoration:none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;">
        <path d="M12 2C12 2 6 6 6 13C6 17.4183 8.68629 21 12 21C15.3137 21 18 17.4183 18 13C18 6 12 2 12 2Z" fill="#D2E761"/>
        <path d="M12 21V11" stroke="#273A29" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span style="color:#FFFFFF; font-size:25px; font-weight:500; letter-spacing:-0.015em;">Carely</span>
    </a>

    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button aria-label="Open menu" aria-expanded="{{ menuOpen }}" onClick="{{ toggleMenu }}" style="background:transparent; border:1.5px solid rgba(255,255,255,0.35); border-radius:50px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;" style-focus="outline:2px solid #D2E761; outline-offset:2px;" style-hover="border-color:#D2E761;">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
          <rect width="18" height="2" rx="1" fill="#FFFFFF"></rect>
          <rect y="6" width="18" height="2" rx="1" fill="#FFFFFF"></rect>
          <rect y="12" width="18" height="2" rx="1" fill="#FFFFFF"></rect>
        </svg>
      </button>
    </sc-if>

    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; align-items:center; gap:42px;">
        <a href="Navbar.dc.html" aria-current="{{ homeCurrent }}" style="text-decoration:none; white-space:nowrap; font-size:17px; font-weight:500; color:#FFFFFF; display:flex; align-items:center; gap:8px; transition:color 0.2s ease;" style-hover="color:#D2E761;">
          Home
          <sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="width:6px; height:6px; border-radius:50%; background:#D2E761; display:block;"></span>
          </sc-if>
        </a>
        <a href="About%20Us.dc.html" aria-current="{{ aboutCurrent }}" style="text-decoration:none; white-space:nowrap; font-size:17px; font-weight:500; color:#FFFFFF; display:flex; align-items:center; gap:8px; transition:color 0.2s ease;" style-hover="color:#D2E761;">
          About Us
          <sc-if value="{{ isAbout }}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="width:6px; height:6px; border-radius:50%; background:#D2E761; display:block;"></span>
          </sc-if>
        </a>
        <a href="Services.dc.html" style="text-decoration:none; white-space:nowrap; font-size:17px; font-weight:500; color:#FFFFFF; transition:color 0.2s ease;" style-hover="color:#D2E761;">Services</a>
        <a href="#" style="text-decoration:none; white-space:nowrap; font-size:17px; font-weight:500; color:#FFFFFF; transition:color 0.2s ease;" style-hover="color:#D2E761;">Programs</a>
        <a href="Contact%20Us.dc.html" style="text-decoration:none; white-space:nowrap; display:flex; align-items:center; height:52px; background:#FFFFFF; color:#273A29; font-weight:600; font-size:17px; padding:0 30px; border-radius:999px; transition:background 0.2s ease;" style-hover="background:#D2E761; color:#273A29;" style-focus="outline:2px solid #E2A76F; outline-offset:2px;">Contact Us</a>
      </div>
    </sc-if>
  </nav>

  <sc-if value="{{ showDrawer }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(10,10,10,0.35); z-index:10; display:flex; justify-content:center;" onClick="{{ toggleMenu }}">
      <div style="width:calc(100% - 64px); max-width:1080px; margin-top:120px; background:#273A29; border-radius:28px; padding:12px; box-sizing:border-box; height:fit-content;" onClick="{{ stopProp }}">
        <a href="Navbar.dc.html" style="display:block; text-decoration:none; color:#FFFFFF; font-size:17px; font-weight:500; padding:14px 20px; border-radius:14px; transition:background 0.2s ease, color 0.2s ease;" style-hover="background:rgba(255,255,255,0.08); color:#D2E761;">Home</a>
        <a href="About%20Us.dc.html" style="display:block; text-decoration:none; color:#FFFFFF; font-size:17px; font-weight:500; padding:14px 20px; border-radius:14px; transition:background 0.2s ease, color 0.2s ease;" style-hover="background:rgba(255,255,255,0.08); color:#D2E761;">About Us</a>
        <a href="Services.dc.html" style="display:block; text-decoration:none; color:#FFFFFF; font-size:17px; font-weight:500; padding:14px 20px; border-radius:14px; transition:background 0.2s ease, color 0.2s ease;" style-hover="background:rgba(255,255,255,0.08); color:#D2E761;">Services</a>
        <a href="#" style="display:block; text-decoration:none; color:#FFFFFF; font-size:17px; font-weight:500; padding:14px 20px; border-radius:14px; transition:background 0.2s ease, color 0.2s ease;" style-hover="background:rgba(255,255,255,0.08); color:#D2E761;">Programs</a>
        <a href="Contact%20Us.dc.html" style="display:block; text-decoration:none; text-align:center; background:#F8FBEF; color:#0A0A0A; font-weight:700; font-size:17px; padding:14px 20px; border-radius:14px; margin-top:8px; transition:background 0.2s ease;" style-hover="background:#D2E761;">Contact Us</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:140},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;About Us&quot;,&quot;Services&quot;,&quot;Programs&quot;,&quot;Contact Us&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? window.innerWidth : 1200, menuOpen: false };

  componentDidMount() {
    this.onResize = () => this.setState({ width: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    this.onResize();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
  }

  renderVals() {
    const isMobile = this.state.width < 860;
    const current = this.props.current || 'Home';
    const isHome = current === 'Home';
    const isAbout = current === 'About Us';
    return {
      isMobile,
      isDesktop: !isMobile,
      isHome,
      isAbout,
      homeCurrent: isHome ? 'page' : undefined,
      aboutCurrent: isAbout ? 'page' : undefined,
      menuOpen: this.state.menuOpen,
      showDrawer: isMobile && this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      stopProp: (e) => e.stopPropagation(),
    };
  }
}
</script>
</body>
</html>
