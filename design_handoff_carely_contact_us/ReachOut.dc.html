<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital@1&display=swap" rel="stylesheet">
<style>
.om-fi::placeholder { color: #8A918B; opacity: 1; }
</style>
</helmet>
<section aria-labelledby="reach-out-title" style="width:100%; background:#F8FBEF; font-family:'DM Sans', sans-serif; box-sizing:border-box; padding:clamp(70px,8vw,130px) 0 clamp(24px,2.4vw,36px);">
  <div style="width:calc(100% - 80px); max-width:1440px; margin:0 auto; display:grid; gap:clamp(44px,5vw,90px); align-items:start; grid-template-columns:{{ cols }};">

    <div style="min-width:0;">
      <p style="margin:0; display:flex; align-items:center; gap:11px; font-family:'Lora', serif; font-style:italic; font-weight:400; font-size:clamp(18px,1.6vw,22px); color:#273A29;">
        <span aria-hidden="true" style="width:9px; height:9px; border-radius:50%; background:#E2A76F; display:block; flex-shrink:0;"></span>
        Reach out
      </p>

      <h2 id="reach-out-title" style="margin:18px 0 0; font-weight:700; font-size:clamp(34px,3.4vw,56px); line-height:1.12; letter-spacing:-0.025em; color:#273A29; text-wrap:pretty;">Have questions? we’re just <em style="font-family:'Lora', serif; font-style:italic; font-weight:400; letter-spacing:0;">a message away</em></h2>

      <p style="margin:22px 0 0; max-width:520px; font-size:18px; line-height:1.6; color:#6E756E; text-wrap:pretty;">Fill out the form below and our team will get back to you shortly with the care and answers you need.</p>

      <div style="margin-top:clamp(34px,3.6vw,52px); max-width:560px; background:#273A29; border-radius:22px; padding:clamp(26px,2.6vw,36px); box-sizing:border-box;">
        <div style="display:flex; align-items:center; gap:18px;">
          <span aria-hidden="true" style="width:56px; height:56px; border-radius:50%; background:#E2A76F; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="8.4" stroke="#FFFFFF" stroke-width="1.8"></circle>
              <path d="M12 7.6V12l3.2 1.9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
          </span>
          <h3 style="margin:0; font-weight:700; font-size:clamp(21px,1.8vw,26px); color:#FFFFFF;">Opening hours</h3>
        </div>

        <dl style="margin:clamp(24px,2.4vw,34px) 0 0; display:grid; gap:16px;">
          <div style="display:flex; align-items:baseline; justify-content:space-between; gap:20px;">
            <dt style="margin:0; font-size:17px; color:#F8FBEF;">Monday – Friday</dt>
            <dd style="margin:0; font-size:17px; color:#F8FBEF; text-align:right;">8:00 AM – 8:00 PM</dd>
          </div>
          <div style="display:flex; align-items:baseline; justify-content:space-between; gap:20px;">
            <dt style="margin:0; font-size:17px; color:#F8FBEF;">Saturday – Sunday</dt>
            <dd style="margin:0; font-size:17px; color:#F8FBEF; text-align:right;">Closed</dd>
          </div>
        </dl>
      </div>
    </div>

    <div style="min-width:0; background:#F3F4F2; border-radius:26px; padding:clamp(26px,3vw,52px); box-sizing:border-box;">
      <form onSubmit="{{ onSubmit }}" style="display:grid; gap:clamp(18px,1.8vw,26px); grid-template-columns:{{ fieldCols }};">
        <label style="min-width:0; display:block;">
          <span style="position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%);">First Name</span>
          <input class="om-fi" type="text" name="firstName" autocomplete="given-name" placeholder="First Name" style="width:100%; box-sizing:border-box; height:66px; padding:0 22px; border:1px solid transparent; border-radius:14px; background:#FFFFFF; font-family:'DM Sans', sans-serif; font-size:17px; color:#273A29; outline:none;" style-focus="border-color:#E2A76F;">
        </label>
        <label style="min-width:0; display:block;">
          <span style="position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%);">Last Name</span>
          <input class="om-fi" type="text" name="lastName" autocomplete="family-name" placeholder="Last Name" style="width:100%; box-sizing:border-box; height:66px; padding:0 22px; border:1px solid transparent; border-radius:14px; background:#FFFFFF; font-family:'DM Sans', sans-serif; font-size:17px; color:#273A29; outline:none;" style-focus="border-color:#E2A76F;">
        </label>
        <label style="min-width:0; display:block;">
          <span style="position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%);">Email</span>
          <input class="om-fi" type="email" name="email" autocomplete="email" placeholder="Email" style="width:100%; box-sizing:border-box; height:66px; padding:0 22px; border:1px solid transparent; border-radius:14px; background:#FFFFFF; font-family:'DM Sans', sans-serif; font-size:17px; color:#273A29; outline:none;" style-focus="border-color:#E2A76F;">
        </label>
        <label style="min-width:0; display:block;">
          <span style="position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%);">Phone</span>
          <input class="om-fi" type="tel" name="phone" autocomplete="tel" placeholder="Phone" style="width:100%; box-sizing:border-box; height:66px; padding:0 22px; border:1px solid transparent; border-radius:14px; background:#FFFFFF; font-family:'DM Sans', sans-serif; font-size:17px; color:#273A29; outline:none;" style-focus="border-color:#E2A76F;">
        </label>
        <label style="min-width:0; display:block; grid-column:1 / -1;">
          <span style="position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%);">Message</span>
          <textarea class="om-fi" name="message" rows="6" placeholder="Message" style="width:100%; box-sizing:border-box; min-height:190px; padding:20px 22px; border:1px solid transparent; border-radius:14px; background:#FFFFFF; font-family:'DM Sans', sans-serif; font-size:17px; line-height:1.55; color:#273A29; outline:none; resize:vertical;" style-focus="border-color:#E2A76F;"></textarea>
        </label>
        <button type="submit" style="grid-column:1 / -1; margin-top:clamp(8px,1vw,16px); width:100%; min-height:66px; border:0; border-radius:14px; background:#E2A76F; color:#FFFFFF; font-family:'DM Sans', sans-serif; font-size:19px; font-weight:700; cursor:pointer; transition:background 0.25s ease, color 0.25s ease;" style-hover="background:#D2E761; color:#273A29;" style-focus="outline:2px solid #273A29; outline-offset:3px;">Submit Message</button>
      </form>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:760}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? window.innerWidth : 1200 };

  componentDidMount() {
    this.onResize = () => this.setState({ width: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    this.onResize();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }

  renderVals() {
    const w = this.state.width;
    return {
      cols: w >= 1040 ? 'minmax(0, 0.68fr) minmax(0, 1fr)' : 'minmax(0, 1fr)',
      fieldCols: w >= 640 ? 'minmax(0, 1fr) minmax(0, 1fr)' : 'minmax(0, 1fr)',
      // No backend exists yet — keep submission inert rather than faking success.
      onSubmit: (e) => e.preventDefault(),
    };
  }
}
</script>
</body>
</html>
